name: Yossi followup PostgreSQL integration
on:
  pull_request:
    paths:
      - 'app.py'
      - 'business_pilot.py'
      - 'form_outreach.py'
      - 'tests/test_form_outreach_database.py'
      - 'tests/test_business_pilot_database.py'
      - 'tests/test_followup_database.py'
      - 'tests/test_owner_resume_database.py'
      - 'tests/test_verified_inbound_gate.py'
      - 'handoff_state.py'
      - 'handoff_store.py'
      - 'handoff_api.py'
      - 'tests/test_handoff_api.py'
      - 'tests/test_operator_echo_webhook.py'
      - '.github/workflows/followup-postgres-test.yml'
  workflow_dispatch:
jobs:
  followup-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: yossi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d yossi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tester:tester@localhost:5432/yossi_test
      OPENAI_API_KEY: sk-offline-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run disposable database tests; never send WhatsApp
        run: |
          python -m unittest discover -s tests -p test_followup_database.py -v
          python -m unittest tests.test_owner_resume_database -v
          python -m unittest tests.test_business_pilot_database -v
          python -m unittest tests.test_form_outreach_database -v
          python -m unittest discover -s tests -p test_verified_inbound_gate.py -v

          python -m unittest discover -s tests -p test_operator_echo_webhook.py -v
          python -m unittest discover -s tests -p test_handoff_api.py -v
