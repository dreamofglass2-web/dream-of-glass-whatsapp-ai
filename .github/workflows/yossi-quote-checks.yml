name: Yossi quote safety checks
on:
  push:
    branches:
      - fix/yossi-quote-closing-review-20261010
  pull_request:
    branches:
      - main
jobs:
  quote-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m py_compile app.py tools/yossi_ai_simulator.py
      - name: Install application dependencies for isolated simulation
        run: pip install -r requirements.txt
      - name: Offline multi-turn customer simulations
        env:
          OPENAI_API_KEY: sk-offline-test-only
          DATABASE_URL: ""
          WHATSAPP_TOKEN: ""
        run: python -m unittest discover -s tests -p "test_conversation_simulator.py" -v
      - name: Focused regression checks
        run: python -m unittest discover -s tests -p "test_quote_flow.py" -v

      - name: Separate shower items and handle picture requests
        run: python -m unittest discover -s tests -p "test_sales_items.py" -v

      - name: Grounded consultant quote preservation
        run: python -m unittest discover -s tests -p "test_sales_reply.py" -v

      - name: Illustration intent and catalog honesty
        run: python -m unittest discover -s tests -p "test_sales_visuals.py" -v

      - name: Compact consultation and usage regressions
        run: python -m unittest discover -s tests -p "test_sales_dialogue.py" -v

      - name: Voice transcription and inbound admission regressions
        env:
          OPENAI_API_KEY: sk-offline-test-only
          DATABASE_URL: ""
          WHATSAPP_TOKEN: ""
        run: |
          python -m unittest discover -s tests -p "test_audio_transcription.py" -v
          python -m unittest discover -s tests -p "test_verified_inbound_gate.py" -v

      - name: Owner escalation and handoff regressions
        env:
          OPENAI_API_KEY: sk-offline-test-only
        run: |
          python -m unittest discover -s tests -p "test_owner_escalation.py" -v
          python -m unittest discover -s tests -p "test_owner_requests.py" -v
          python -m unittest discover -s tests -p "test_business_pilot.py" -v
          python -m unittest tests.test_form_outreach -v
          python -m unittest tests.test_direct_lead_pilot -v
          python -m unittest tests.test_form_message_pilot -v
          python -m unittest tests.test_automatic_echo -v
          python -m unittest tests.test_form_media_intent -v
          python -m unittest discover -s tests -p "test_mirror_policy.py" -v
          python -m unittest discover -s tests -p "test_handoff_state.py" -v
          python -m unittest discover -s tests -p "test_handoff_api.py" -v
          python -m unittest tests.test_owner_resume -v

      - name: Service readiness and bot-only Gunicorn startup
        env:
          OPENAI_API_KEY: sk-offline-test-only
          DATABASE_URL: ""
          WHATSAPP_TOKEN: ""
        run: python -m unittest discover -s tests -p "test_service_health.py" -v


      - name: CRM message times and progress
        run: |
          python -m unittest discover -s tests -p "test_crm_records.py" -v
          python -m unittest crm_lab.test_customer_detail -v

      - name: Kitchen cladding price and document delivery
        env:
          OPENAI_API_KEY: sk-offline-test-only
          DATABASE_URL: ""
          WHATSAPP_TOKEN: ""
        run: python -m unittest tests.test_kitchen_cladding -v

      - name: Four-item inventory and sliding button-only handles
        env:
          OPENAI_API_KEY: sk-offline-test-only
          DATABASE_URL: ""
          WHATSAPP_TOKEN: ""
        run: python -m unittest tests.test_four_item_order -v

      - name: Layout advice instead of repeated technical question
        env:
          OPENAI_API_KEY: sk-offline-test-only
          DATABASE_URL: ""
          WHATSAPP_TOKEN: ""
        run: python -m unittest tests.test_layout_consultation -v
