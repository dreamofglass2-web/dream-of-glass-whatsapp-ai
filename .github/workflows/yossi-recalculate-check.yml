name: Yossi grounded recalculation check
on:
  pull_request:
    types: [opened]
    branches: [main]
jobs:
  real-model-sales-conversations:
    if: github.head_ref == 'test/yossi-recalculate-20261013' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.YOSSI_TEST_OPENAI_API_KEY }}
      RUN_LIVE_YOSSI_TESTS: "1"
      OPENAI_MODEL: gpt-6-astra
      HANDOFF_ENABLED: "false"
      YOSSI_TEST_MAX_CALLS: "12"
      YOSSI_TEST_MAX_USD: "1"
      YOSSI_TEST_SCENARIOS: "spec_change,front_owner_height"
      DATABASE_URL: ""
      WHATSAPP_TOKEN: ""
      SEND_QUOTES: "true"
      TYPING_MIN_SECONDS: "0"
      TYPING_MAX_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require dedicated API test secret
        run: test -n "$OPENAI_API_KEY"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run isolated real-model conversations
        run: python tools/yossi_ai_simulator.py
      - name: Preserve only synthetic dialogue report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yossi-ai-test-transcripts
          path: yossi_ai_test_report.json
          if-no-files-found: ignore
