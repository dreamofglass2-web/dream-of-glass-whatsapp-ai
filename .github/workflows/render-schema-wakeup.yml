name: Ensure Render startup schemas
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  wake-and-initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for automatic Render deployment to finish
        run: sleep 90
      - name: Initialize database schemas using safe health endpoint
        run: |
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 15 --retry-all-errors \
            --max-time 90 \
            https://dream-of-glass-whatsapp-ai.onrender.com/health
